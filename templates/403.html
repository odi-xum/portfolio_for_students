{% extends 'base.html' %}
{% block title %}Доступ запрещён — ИС Портфолио{% endblock %}
{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
    <div style="font-size: 5rem; line-height: 1; margin-bottom: 1rem;">🚫</div>
    <h1 style="color: var(--orange); margin-bottom: 1rem;">403 — Доступ запрещён</h1>
    <p style="color: var(--fg1); font-size: 1.1rem; max-width: 500px; margin: 0 auto;">
        У вас нет прав для просмотра этой страницы. Если вы считаете, что это ошибка,
        обратитесь к администратору.
    </p>
    <a href="{{ url_for('login') if not current_user.is_authenticated else '#' }}" class="btn btn-primary"
       style="margin-top: 2rem; display: inline-block;{% if current_user.is_authenticated %}display:none;{% endif %}">
        Войти
    </a>
</div>
{% endblock %}
