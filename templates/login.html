{% extends 'base.html' %}

{% block title %}Вход — Портфолио студентов{% endblock %}

{% block login_content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg0); padding: 1.5rem;">
    <div style="width: 100%; max-width: 400px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 56px; height: 56px; margin: 0 auto 1rem; background: linear-gradient(135deg, var(--blue), var(--purple)); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; color: #fff;">📋</div>
            <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; letter-spacing: -0.3px;">Портфолио студентов</h1>
            <p style="color: var(--fg2); font-size: 0.875rem;">Войдите в систему</p>
        </div>

        <div class="card" style="padding: 2rem;">
            <form method="POST" action="/">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label class="form-label" for="username">Логин</label>
                    <input type="text" id="username" name="username" class="form-input" required autofocus placeholder="Введите логин">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Пароль</label>
                    <input type="password" id="password" name="password" class="form-input" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 0.5rem;">Войти</button>
            </form>
        </div>

        <p style="text-align: center; margin-top: 1.5rem; color: var(--fg2); font-size: 0.8rem;">
            Тестовые: admin / commission / cur1–cur7 / student1–student25 (пароль: 111)
        </p>
    </div>
</div>
{% endblock %}
