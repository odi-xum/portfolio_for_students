{% extends 'base.html' %}

{% block content %}
<div style="max-width: 450px; margin: 5rem auto;">
    <div class="form-card">
        <h2 style="margin-bottom: 1.5rem; color: var(--orange); text-align: center;">Вход в систему</h2>
        <form method="POST" action="/">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
